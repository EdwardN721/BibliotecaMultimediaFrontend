
<div class="max-w-4xl mx-auto space-y-8">

  <div class="flex items-center space-x-4">
    <button routerLink="/admin/items"
            class="w-10 h-10 flex items-center justify-center rounded-full bg-white border border-slate-200 hover:bg-slate-100 dark:bg-slate-800 dark:border-slate-700 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors shadow-sm hover:shadow-md">
      <i class="pi pi-arrow-left"></i>
    </button>
    <div>
      <h2 class="text-3xl font-black tracking-tight text-slate-900 dark:text-white">Registrar Nuevo Genero</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Añade un genero al catálogo
        maestro.</p>
    </div>
  </div>

  <div
    class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl shadow-slate-200/50 dark:shadow-2xl dark:shadow-black/50 border border-slate-200 dark:border-slate-800 p-6 sm:p-10 relative overflow-hidden">

    <div class="absolute top-0 left-0 w-full h-1.5 bg-linear-to-r from-blue-500 via-indigo-500 to-purple-500"></div>

    <form [formGroup]="formulario" (ngSubmit)="guardar()" class="space-y-8 mt-2">

      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide">Nombre: <span
          class="text-red-500">*</span></label>
        <p-iconField iconPosition="left">
          <p-inputIcon class="pi pi-bookmark text-slate-400 dark:text-slate-500"></p-inputIcon>
          <input pInputText formControlName="name" placeholder="Escriba el nombre del genero"
                 class="w-full p-3 pl-10 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white rounded-lg focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all shadow-inner" />
        </p-iconField>
        @if (formulario.get('name')?.invalid && formulario.get('name')?.touched) {
          <small class="text-red-500 font-medium flex items-center gap-1 mt-1"><i class="pi pi-info-circle text-xs"></i>
            El nombre es obligatorio.</small>
        }
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide">Descripcion: </label>
        <textarea pTextarea formControlName="description" rows="5" placeholder="Escriba la descripción del genero..."
                  class="w-full p-3 resize-none leading-relaxed bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white rounded-lg focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all shadow-inner"></textarea>
      </div>

      <div class="flex items-center justify-end space-x-4 pt-6 border-t border-slate-200 dark:border-slate-800">
        <button type="button" routerLink="/admin/catalogos/generos"
                class="px-6 py-2.5 rounded-xl text-sm font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-transparent hover:border-slate-300 dark:hover:border-slate-600 transition-all">
          Cancelar
        </button>
        <p-button label="Agregar creador" icon="pi pi-check" type="submit" [loading]="isSubmitting()"
                  [disabled]="formulario.invalid"
                  styleClass="px-8 py-2.5 bg-blue-600 hover:bg-blue-500 text-white border-none rounded-xl shadow-lg shadow-blue-600/30 hover:shadow-blue-500/60 hover:-translate-y-0.5 transition-all duration-300 font-bold"></p-button>
      </div>

    </form>
  </div>
</div>
