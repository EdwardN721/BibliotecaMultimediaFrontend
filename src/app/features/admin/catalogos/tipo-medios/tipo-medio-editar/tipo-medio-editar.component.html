<div class="max-w-4xl mx-auto space-y-8">

  <div class="flex items-center space-x-4">
    <button routerLink="/admin/items" class="w-10 h-10 flex items-center justify-center rounded-full bg-white border border-slate-200 hover:bg-slate-100 dark:bg-slate-800 dark:border-slate-700 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors shadow-sm hover:shadow-md">
      <i class="pi pi-arrow-left"></i>
    </button>
    <div>
      <h2 class="text-3xl font-black tracking-tight text-slate-900 dark:text-white">Modificar Datos Medios</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Actualizando la información del medio.</p>
    </div>
  </div>

  <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl shadow-slate-200/50 dark:shadow-2xl dark:shadow-black/50 border border-slate-200 dark:border-slate-800 p-6 sm:p-10 relative overflow-hidden">

    <div class="absolute top-0 left-0 w-full h-1.5 bg-linear-to-r from-amber-400 via-orange-500 to-red-500"></div>

    @if (isLoadingData()) {
      <div class="flex flex-col items-center justify-center py-20">
        <i class="pi pi-sync pi-spin text-5xl text-orange-500 mb-4"></i>
        <p class="text-slate-500 dark:text-slate-400 font-bold tracking-wide">Sincronizando información...</p>
      </div>
    }
    @else {
      <form [formGroup]="formulario" (ngSubmit)="actualizar()" class="space-y-8 mt-2">

        <div class="flex flex-col gap-2">
          <label class="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide">Nombre del medio: <span class="text-red-500">*</span></label>
          <p-iconField iconPosition="left">
            <p-inputIcon class="pi pi-bookmark text-slate-400 dark:text-slate-500"></p-inputIcon>
            <input pInputText formControlName="nombre"
                   class="w-full p-3 pl-10 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white rounded-lg focus:ring-2 focus:ring-orange-500/50 focus:border-orange-500 transition-all shadow-inner" />
          </p-iconField>
        </div>

        <div class="flex items-center justify-end space-x-4 pt-6 border-t border-slate-200 dark:border-slate-800">
          <button type="button" routerLink="/admin/catalogos/formatos"
                  class="px-6 py-2.5 rounded-xl text-sm font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-transparent hover:border-slate-300 dark:hover:border-slate-600 transition-all">
            Cancelar
          </button>
          <p-button label="Guardar Cambios" icon="pi pi-save" type="submit" [loading]="isSubmitting()" [disabled]="formulario.invalid"
                    styleClass="px-8 py-2.5 bg-orange-600 hover:bg-orange-500 text-white border-none rounded-xl shadow-lg shadow-orange-600/30 hover:shadow-orange-500/60 hover:-translate-y-0.5 transition-all duration-300 font-bold"></p-button>
        </div>

      </form>
    }
  </div>
</div>
