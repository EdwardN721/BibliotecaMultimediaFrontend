<div class="max-w-5xl mx-auto space-y-8 pb-10">

  <div class="flex items-center space-x-4">
    <button routerLink="/admin/items" class="w-10 h-10 flex items-center justify-center rounded-full bg-white border border-slate-200 hover:bg-slate-100 dark:bg-slate-800 dark:border-slate-700 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors shadow-sm hover:shadow-md">
      <i class="pi pi-arrow-left"></i>
    </button>
    <div>
      <h2 class="text-3xl font-black tracking-tight text-slate-900 dark:text-white">Registrar Nuevo Ítem</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Añade una película, serie o videojuego al catálogo maestro.</p>
    </div>
  </div>

  <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl shadow-slate-200/50 dark:shadow-2xl dark:shadow-black/50 border border-slate-200 dark:border-slate-800 p-6 sm:p-10 relative overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-1.5 bg-linear-to-r from-blue-500 via-indigo-500 to-purple-500"></div>

    @if (isLoadingCatalogos()) {
      <div class="flex flex-col items-center justify-center py-20">
        <i class="pi pi-sync pi-spin text-5xl text-blue-500 mb-4"></i>
        <p class="text-slate-500 dark:text-slate-400 font-bold tracking-wide">Cargando catálogos del sistema...</p>
      </div>
    } @else {
      <form [formGroup]="itemForm" (ngSubmit)="guardar()" class="space-y-8 mt-2">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="md:col-span-2 flex flex-col gap-2">
            <label class="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide">Título de la Obra <span class="text-red-500">*</span></label>
            <p-iconField iconPosition="left">
              <p-inputIcon class="pi pi-bookmark text-slate-400 dark:text-slate-500"></p-inputIcon>
              <input pInputText formControlName="title" placeholder="Ej. The Last of Us Part II"
                     class="w-full p-3 pl-10 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white rounded-lg focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all shadow-inner" />
            </p-iconField>
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide">Calificación</label>
            <p-inputNumber formControlName="rating" [min]="0" [max]="10" [minFractionDigits]="0" [maxFractionDigits]="1"
                           class="w-full" [fluid]="true"
                           inputStyleClass="w-full p-3 text-center font-black text-blue-600 dark:text-blue-400 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 shadow-inner" placeholder="0 - 10"></p-inputNumber>
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide">Sinopsis / Descripción</label>
          <textarea pTextarea formControlName="descripcion" rows="4" placeholder="Escribe un breve resumen de la trama..."
                    class="w-full p-3 resize-none leading-relaxed bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white rounded-lg focus:ring-2 focus:ring-blue-500/50 shadow-inner"></textarea>
        </div>

        <div class="border-t border-slate-200 dark:border-slate-800 pt-6"></div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide">Tipo de Medio <span class="text-red-500">*</span></label>
            <p-select [options]="tiposMedio()" formControlName="mediaTypeId" optionLabel="nombre" optionValue="id" placeholder="Selecciona el tipo"
                      class="w-full custom-select" [fluid]="true"></p-select>
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide">Formato <span class="text-red-500">*</span></label>
            <p-select [options]="formatos()" formControlName="formatId" optionLabel="nombre" optionValue="id" placeholder="Selecciona el formato"
                      class="w-full" [fluid]="true"></p-select>
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide">Plataforma (Opcional)</label>
            <p-select [options]="plataformas()" formControlName="platformId" optionLabel="nombre" optionValue="id" [showClear]="true" placeholder="¿Exclusivo de alguna plataforma?"
                      class="w-full" [fluid]="true"></p-select>
          </div>

        </div>

        <div class="border-t border-slate-200 dark:border-slate-800 pt-6"></div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide">Géneros <span class="text-red-500">*</span></label>
            <p-multiSelect [options]="generos()" formControlName="genreIds" optionLabel="name" optionValue="id" placeholder="Selecciona uno o más géneros" [filter]="true"
                           display="chip" class="w-full" [fluid]="true"></p-multiSelect>
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide">Creadores / Directores</label>
            <p-multiSelect [options]="creadores()" formControlName="creatorIds" optionLabel="nombre" optionValue="id" placeholder="¿Quiénes participaron?" [filter]="true"
                           display="chip" class="w-full" [fluid]="true"></p-multiSelect>
          </div>

        </div>

        <div class="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800/80 rounded-xl p-5 flex items-center space-x-4 mt-6">
          <p-checkbox formControlName="isFavorite" [binary]="true" inputId="isFav" class="bg-white dark:bg-slate-800 rounded border border-slate-300 dark:border-slate-600 focus-within:ring-2 focus-within:ring-blue-500/50"></p-checkbox>
          <div>
            <label for="isFav" class="text-sm font-bold text-slate-800 dark:text-slate-200 cursor-pointer block select-none">Destacar como Favorito</label>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Aparecerá en la sección de recomendaciones principales.</p>
          </div>
        </div>

        <div class="flex items-center justify-end space-x-4 pt-6 border-t border-slate-200 dark:border-slate-800">
          <button type="button" routerLink="/admin/items" class="px-6 py-2.5 rounded-xl text-sm font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
            Cancelar
          </button>
          <p-button label="Guardar Registro" icon="pi pi-check" type="submit" [loading]="isSubmitting()" [disabled]="itemForm.invalid"
                    styleClass="px-8 py-2.5 bg-blue-600 hover:bg-blue-500 text-white border-none rounded-xl shadow-lg shadow-blue-600/30 hover:shadow-blue-500/60 hover:-translate-y-0.5 transition-all duration-300 font-bold"></p-button>
        </div>

      </form>
    }
  </div>
</div>
