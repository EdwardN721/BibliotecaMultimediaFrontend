<div class="min-h-screen flex items-center justify-center bg-slate-900 px-4">
  
  <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700">
    
    <div class="text-center mb-8">
      <h2 class="text-3xl font-extrabold text-white tracking-tight">
        Biblioteca <span class="text-blue-500">Multimedia</span>
      </h2>
      <p class="text-slate-400 mt-2">Inicia sesión en tu cuenta</p>
    </div>

    <form class="space-y-6">
      
      <div>
        <label for="email" class="block text-sm font-medium text-slate-300">Correo Electrónico</label>
        <div class="mt-1">
          <input id="email" name="email" type="email" required 
            class="appearance-none block w-full px-3 py-2 border border-slate-600 rounded-lg shadow-sm bg-slate-700 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-300">Contraseña</label>
        <div class="mt-1">
          <input id="password" name="password" type="password" required 
            class="appearance-none block w-full px-3 py-2 border border-slate-600 rounded-lg shadow-sm bg-slate-700 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
        </div>
      </div>

      <div>
        <button type="submit" 
          class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-blue-500 transition-all">
          Entrar
        </button>
      </div>

    </form>
  </div>
</div>
