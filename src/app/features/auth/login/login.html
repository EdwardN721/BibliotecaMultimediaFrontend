<div class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-950 p-4 transition-colors duration-300">
  
  <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 p-8 sm:p-10 transition-colors duration-300">
    
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-600 text-white mb-4 shadow-lg shadow-blue-500/30">
        <i class="pi pi-play text-xl"></i>
      </div>
      <h2 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">StreamBox</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">Inicia sesión en tu cuenta para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <div class="space-y-2">
        <label class="text-sm font-semibold text-slate-700 dark:text-slate-300 block">Correo Electrónico</label>
        <span class="p-input-icon-left w-full block">
          <i class="pi pi-envelope text-slate-400"></i>
          <input type="email" pInputText formControlName="email" class="w-full pl-10" placeholder="ejemplo@correo.com" />
        </span>
      </div>

      <div class="space-y-2">
        <label class="text-sm font-semibold text-slate-700 dark:text-slate-300 block">Contraseña</label>
        <span class="p-input-icon-left w-full block">
          <i class="pi pi-lock text-slate-400"></i>
          <input type="password" pInputText formControlName="password" class="w-full pl-10" placeholder="••••••••" />
        </span>
      </div>

      @if (errorMessage()) {
        <div class="p-3 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg text-sm text-red-600 dark:text-red-400 flex items-center space-x-2">
          <i class="pi pi-exclamation-circle"></i>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <button type="submit" [disabled]="loginForm.invalid || isLoading()" 
        class="w-full flex items-center justify-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white py-3 px-4 rounded-xl font-semibold transition-all shadow-md shadow-blue-500/20 disabled:opacity-70 disabled:cursor-not-allowed">
        @if (isLoading()) {
          <i class="pi pi-spin pi-spinner"></i>
          <span>Autenticando...</span>
        } @else {
          <span>Ingresar al Sistema</span>
          <i class="pi pi-arrow-right text-xs"></i>
        }
      </button>

    </form>

    <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
      ¿No tienes cuenta?
      <a routerLink="/registro" class="font-semibold text-blue-600 hover:text-blue-500 dark:text-blue-400">Regístrate</a>
    </p>
  </div>
</div>
