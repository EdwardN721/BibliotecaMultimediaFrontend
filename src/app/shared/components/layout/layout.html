<div class="min-h-screen flex bg-slate-950 text-slate-100 font-sans">
  
  <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-4 hidden md:flex">
    <div>
      <div class="flex items-center space-x-2 px-2 py-4 mb-6">
        <span class="text-2xl font-black tracking-wider text-white">
          STREAM<span class="text-blue-500">BOX</span>
        </span>
      </div>

      <nav class="space-y-1.5">
        
        @if (authService.isAdmin()) {
          <div class="px-3 mb-2 text-xs font-semibold text-slate-500 uppercase tracking-wider">
            Gestión de Biblioteca
          </div>
          <a routerLink="/admin" routerLinkActive="bg-blue-600/10 text-blue-400 border-l-4 border-blue-500" [routerLinkActiveOptions]="{exact: true}"
            class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-all">
            <span>Panel de Control</span>
          </a>
          <a routerLink="/admin/items" routerLinkActive="bg-blue-600/10 text-blue-400 border-l-4 border-blue-500"
            class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-all">
            <span>Registrar Nuevos Ítems</span>
          </a>
          <a routerLink="/admin/catalogos" routerLinkActive="bg-blue-600/10 text-blue-400 border-l-4 border-blue-500"
            class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-all">
            <span>Configurar Catálogos</span>
          </a>
        }

        @if (authService.isRegularUser()) {
          <div class="px-3 mb-2 text-xs font-semibold text-slate-500 uppercase tracking-wider">
            Mi Espacio Personal
          </div>
          <a routerLink="/user" routerLinkActive="bg-emerald-600/10 text-emerald-400 border-l-4 border-emerald-500" [routerLinkActiveOptions]="{exact: true}"
            class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-all">
            <span>Mi Inventario</span>
          </a>
          <a routerLink="/user/explorar" routerLinkActive="bg-emerald-600/10 text-emerald-400 border-l-4 border-emerald-500"
            class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-all">
            <span>Explorar y Tomar Ítems</span>
          </a>
        }

      </nav>
    </div>

    <div class="bg-slate-800/40 border border-slate-800 rounded-xl p-3 flex items-center justify-between">
      <div class="truncate">
        <p class="text-xs text-slate-500 font-medium">Conectado como:</p>
        <p class="text-sm font-bold text-slate-300 truncate">{{ currentRoleLabel() }}</p>
      </div>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    
    <header class="bg-slate-900 border-b border-slate-800 h-16 flex items-center justify-between px-6 shadow-sm z-10">
      <div>
        <span class="text-sm text-slate-400 font-medium hidden sm:block">Consola de Control Multimedia</span>
      </div>
      
      <div class="flex items-center space-x-4">
        
        <button (click)="themeService.toggleTheme()" 
          class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors text-slate-600 dark:text-slate-400">
          <i class="pi text-xl" [ngClass]="themeService.isDarkMode() ? 'pi-sun' : 'pi-moon'"></i>   
        </button>

        <button (click)="logout()" ... > Salir </button>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-6 md:p-8 bg-slate-950">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
